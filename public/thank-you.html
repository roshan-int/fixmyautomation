<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Received | FixMyAutomation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #f6f8fb;
            color: #172033;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 620px;
            background: white;
            border-radius: 20px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(20, 30, 50, 0.08);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 35px;
        }

        .check {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: #e8f7ee;
            color: #16834b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            font-size: 32px;
            margin: 0 0 14px;
        }

        p {
            color: #667085;
            font-size: 17px;
            line-height: 1.6;
            margin: 0 auto 28px;
        }

        .button {
            display: inline-block;
            background: #111827;
            color: white;
            text-decoration: none;
            padding: 13px 24px;
            border-radius: 10px;
            font-weight: 600;
        }

        .small {
            margin-top: 24px;
            font-size: 14px;
            color: #98a2b3;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">
            FixMyAutomation
        </div>

        <div class="check">
            ✓
        </div>

        <h1>Request Received</h1>

        <p>
            Thanks for contacting us. We've received your UiPath
            automation repair request and will review the details.
        </p>

        <p>
            We'll get back to you with the next steps and, if needed,
            a repair estimate.
        </p>

        <a class="button" href="/">
            Back to FixMyAutomation
        </a>

        <div class="small">
            You can safely close this page.
        </div>

    </div>

</body>
</html>
